<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-In-One Login System</title>

<style>
/* -------------------------------- GLOBAL -------------------------------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}
body {<div>    <</div>
    height: 100vh;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
    padding: 20px;
}
:root {
    --bg: linear-gradient(135deg, #2a48ff, #6f00ff);
    --card: rgba(255, 255, 255, 0.15);
    --text: #ffffff;
    --button: #ffffff;
    --button-text: #2a48ff;
}
body.dark {
    --: #0f0f0f;
    --card: rgba(255, 255, 255, 0.08);
    --text: #eaeaea;
    --button: #2a48ff;
    --button-text: #ffffff;
}

/* -------------------------------- CARD -------------------------------- */
.card {
    width: 100%;
    max-width: 400px;
    padding: 35px;
    background: var(--card);
    border-radius: 18px;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 50px rgba(0,0,0,0.25);
    text-align: center;
    animation: fadeIn 1s ease;
}

/* -------------------------------- AVATAR -------------------------------- */
.avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: white;
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* -------------------------------- TEXT -------------------------------- */
h2, h1 {
    color: var(--text);
    margin-bottom: 10px;
}
p {
    color: var(--text);
    opacity: 0.8;
}

/* -------------------------------- INPUT -------------------------------- */
input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 16px;
}

/* -------------------------------- BUTTON -------------------------------- */
button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: var(--button);
    color: var(--button-text);
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}
button:hover {
    transform: scale(1.03);
}

/* -------------------------------- DARK MODE -------------------------------- */
.toggle {
    text-align: center;
    margin-bottom: 12px;
}
.toggle button {
    width: auto;
    padding: 7px 18px;
    font-size: 14px;
    border-radius: 20px;
}

/* -------------------------------- ANIMATIONS -------------------------------- */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Typing animation */
.typing {
    font-size: 22px;
    color: var(--text);
    border-right: 2px solid var(--text);
    width: 0;
    white-space: nowrap;
    overflow: hidden;
    animation: typing 3s steps(20), blink 0.5s step-end infinite alternate;
    margin-bottom: 20px;
}
@keyframes typing {
    from { width: 0; }
    to { width: 240px; }
}
@keyframes blink {
    from { border-color: transparent; }
    to { border-color: var(--text); }
}

#welcome { display: none; }
</style>
</head>

<body>

<!-- -------------------------------- LOGIN SCREEN -------------------------------- -->
<div class="card" id="loginCard">
    <div class="toggle"><button onclick="toggleMode()">🌙 / ☀️</button></div>

    <div class="avatar">👤</div>

    <h2>Login</h2>
    <p>Please enter your details to continue</p>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<!-- -------------------------------- WELCOME SCREEN -------------------------------- -->
<div class="card" id="welcome">
    <div class="typing" id="typingText"></div>
    <h1 id="greet"></h1>

    <button onclick="redirect()">Continue</button>
</div>

<script>
/* -------------------------------- DARK MODE -------------------------------- */
function toggleMode() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

/* -------------------------------- AUTO LOGIN -------------------------------- */
if (localStorage.getItem("username")) {
    showWelcome(localStorage.getItem("username"));
}

/* -------------------------------- LOGIN FUNCTION -------------------------------- */
function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
        alert("Please enter username & password");
        return;
    }

    localStorage.setItem("username", user);
    showWelcome(user);
}

/* -------------------------------- SHOW WELCOME -------------------------------- */
function showWelcome(name) {
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("welcome").style.display = "block";

    document.getElementById("greet").textContent = "Welcome, " + name + "!";

    // typing animation text
    document.getElementById("typingText").textContent = "Logging you in...";
}

/* -------------------------------- REDIRECT -------------------------------- */
function redirect() {
    window.location.href = "index.html"; // change this to your homepage
}
</script>

</body>
</html>
