<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Login System</title>

    <style>
        /* ---------- Global Styles ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            transition: 0.4s ease;
            padding: 20px;
        }

        :root {
            --bg: linear-gradient(135deg, #0d6efd, #6610f2);
            --card-bg: rgba(255, 255, 255, 0.18);
            --text-color: #ffffff;
            --button-bg: #ffffff;
            --button-text: #0d6efd;
        }

        body.dark {
            --bg: #121212;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-color: #e8e8e8;
            --button-bg: #0d6efd;
            --button-text: white;
        }

        /* ---------- Cards ---------- */
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 45px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        h2,
        h1 {
            color: var(--text-color);
        }

        /* ---------- Input ---------- */
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.02);
        }

        /* ---------- Dark Mode Toggle ---------- */
        .toggle-box {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .toggle-btn {
            background: var(--button-bg);
            color: var(--button-text);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        /* ---------- Avatar ---------- */
        .avatar {
            width: 90px;
            height: 90px;
            background: #ffffff50;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            backdrop-filter: blur(5px);
        }

        /* ---------- Animations ---------- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #welcome {
            display: none;
        }
    </style>
</head>

<body>

<!-- ---------- LOGIN SCREEN ---------- -->
<div class="card" id="loginCard">
    <div class="toggle-box">
        <div class="toggle-btn" onclick="toggleMode()">🌙 / ☀️</div>
    </div>

    <div class="avatar">👤</div>

    <h2>Welcome Back</h2>

    <input type="text" id="username" placeholder="Enter your name" />
    <input type="password" id="password" placeholder="Enter password" />

    <button onclick="login()">Login</button>
</div>

<!-- ---------- GREETING SCREEN ---------- -->
<div class="card" id="welcome">
    <h1 id="greetText">Welcome!</h1>
    <button onclick="redirect()">Continue</button>
</div>

<script>
    /* ---------- Dark Mode Toggle ---------- */
    function toggleMode() {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    // Load theme from storage
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
    }

    /* ---------- Auto Login ---------- */
    const savedUser = localStorage.getItem("username");
    if (savedUser) {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("welcome").style.display = "block";
        document.getElementById("greetText").textContent = "Welcome back, " + savedUser + "!";
    }

    /* ---------- Login Logic ---------- */
    function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (username === "" || password === "") {
            alert("Please fill all fields.");
            return;
        }

        // Save username
        localStorage.setItem("username", username);

        // Switch screens
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("welcome").style.display = "block";
        document.getElementById("greetText").textContent = "Welcome, " + username + "!";
    }

    /* ---------- Redirect After Login ---------- */
    function redirect() {
        // Change this URL to your portfolio or dashboard
        window.location.href = "https://your-portfolio-link.com";
    }
</script>

</body>
</html><div><img src="" alt=""></div>
